<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;700;800&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Cairo', sans-serif;
            overflow: hidden;
        }

        .slide-container {
            width: 1280px;
            min-height: 720px;
            background-color: #F4F6F8;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-end;
            padding-right: 80px;
        }

        .background-element {
            position: absolute;
            left: 0;
            top: 0;
            width: 40%;
            height: 100%;
            background-color: #0B3C5D;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }

        .year-text {
            font-size: 240px;
            font-weight: 800;
            color: rgba(229, 124, 35, 0.2);
            transform: rotate(-90deg);
        }

        .content {
            z-index: 2;
            text-align: right;
            max-width: 700px;
        }

        .header-rule {
            width: 100px;
            height: 8px;
            background-color: #E57C23;
            margin-bottom: 40px;
            margin-right: 0;
        }

        h1 {
            font-size: 84px;
            font-weight: 800;
            color: #0B3C5D;
            line-height: 1.1;
            margin-bottom: 20px;
        }

        .subtitle {
            font-size: 28px;
            font-weight: 500;
            color: #4A5568;
            margin-bottom: 60px;
        }

        .footer-info {
            border-top: 1px solid #0B3C5D;
            padding-top: 20px;
            width: 100%;
            display: flex;
            justify-content: flex-start;
            gap: 40px;
        }

        .info-item {
            font-size: 18px;
            color: #4A5568;
            font-weight: 500;
        }

        .accent-text {
            color: #E57C23;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="background-element">
            <div class="year-text">2025</div>
        </div>
        
        <div class="content">
            <div class="header-rule"></div>
            <h1>مراجعة الأعمال<br>الاستراتيجية</h1>
            <div class="subtitle">
                <span class="accent-text">B2-Rent</span> | منصة تأجير السيارات والعقارات في المغرب
            </div>
            
            <div class="footer-info">
                <div class="info-item">السنة المالية 2025</div>
                <div class="info-item">اجتماع القيادة</div>
                <div class="info-item">الدار البيضاء</div>
            </div>
            
            <div style="margin-top: 40px; font-style: italic; color: #4A5568; font-size: 16px;">
                "من نمو الطلب إلى اقتصاديات وحدة أكثر انضباطاً"
            </div>
        </div>
    </div>
</body>
</html>
